name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        name: Typecheck and build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24.15.0
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # Typecheck + renderer/main bundling only. Packaging into installers is
            # handled by the "Build" workflow, which is manual or tag-triggered.
            - name: Build
              run: npm run build
